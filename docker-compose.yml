version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aias-postgres
    environment:
      POSTGRES_DB: aias_db
      POSTGRES_USER: aias_user
      POSTGRES_PASSWORD: aias_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aias_user -d aias_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
